# Sert le client et relaie /api vers l'API (même domaine : pas de CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security.conf;

    # Adresse de l'API, fixée au démarrage du conteneur (variable BP_API_URL).
    location /api/ {
        proxy_pass ${BP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Derrière Apache : protocole vu par le navigateur (https).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # WebSocket (temps réel, à venir).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # Application monopage : toute autre adresse renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers versionnés par trunk (empreinte dans le nom) : longue mise en cache.
    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security.conf;
    }

    # Pas de fichiers cachés (.env, .git…).
    location ~ /\. {
        deny all;
    }
}
