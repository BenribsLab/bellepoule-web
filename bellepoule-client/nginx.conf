# Sert le client et relaie /api vers l'API (même domaine : pas de CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Adresse de l'API, fixée au démarrage du conteneur (variable BP_API_URL).
    location /api/ {
        proxy_pass ${BP_API_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (temps réel, à venir).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 20m;
    }

    # Application monopage : toute autre adresse renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
