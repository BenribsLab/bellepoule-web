{# Capture d'écran avec légende ; rien n'est affiché si l'image n'existe pas. #}
{% set file = "docs/" ~ src %}
{% set meta = get_image_metadata(path=file, allow_missing=true) %}
{% if meta %}
<figure class="shot{% if class is defined %} {{ class }}{% endif %}">
  <a href="{{ get_url(path=file, cachebust=true) }}"><img src="{{ get_url(path=file, cachebust=true) }}" alt="{{ caption }}" width="{{ meta.width }}" height="{{ meta.height }}" loading="lazy"></a>
  <figcaption>{{ caption }}</figcaption>
</figure>
{% endif %}
