{# Icônes à traits (24 × 24), sans ressource extérieure. #}
{% macro icon(name) %}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "trophy" -%}<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>

{%- elif name == "tv" -%}<rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>

{%- elif name == "code" -%}<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>

{%- else -%}<circle cx="12" cy="12" r="4"/>

</svg>
